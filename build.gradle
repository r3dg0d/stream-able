plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

// Per-Minecraft-version settings (see versions/README in gradle.properties).
// A property passed with -P on the command line still wins over the file.
def mcTarget = project.mc_target
def mcVersionFile = file("versions/${mcTarget}.properties")
if (!mcVersionFile.exists()) {
    throw new GradleException("Unsupported mc_target '${mcTarget}'. Supported: " +
            file('versions').listFiles().collect { it.name - '.properties' }.sort().join(', '))
}
def mcProps = new Properties()
mcVersionFile.withInputStream { mcProps.load(it) }
mcProps.each { k, v ->
    if (!project.gradle.startParameter.projectProperties.containsKey(k)) {
        project.ext.set(k as String, v as String)
    }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Minecraft 26.x ships a deobfuscated client, so no mapping layer is declared
// (this mirrors MCEF Modern's own buildscript for the same Minecraft line).
loom {
    runs {
        client {
            client()
            ideConfigGenerated = true
            // Separate run directories per Minecraft version keep saves and mods
            // of one version out of another:  ./gradlew runClient -Prun_dir=run/26.3
            runDir = findProperty('run_dir') ?: 'run'
            // ./gradlew runClient -Pquick_play_world="New World" joins a world at start.
            if (findProperty('quick_play_world')) {
                programArgs '--quickPlaySingleplayer', findProperty('quick_play_world')
            }
        }
    }
}

// Shared code lives in src/main; classes that touch a Minecraft surface which
// differs between versions live in src/compat/<compat_dir>, one directory per
// version line, each providing the same classes.
sourceSets {
    main {
        java {
            srcDir "src/compat/${project.compat_dir}/java"
        }
        resources {
            // GLSL differs between Minecraft versions (26.3 needs explicit locations
            // and a reordered uniform block), so shaders live in per-version sets.
            srcDir "src/shaders/${project.shader_set}"
        }
    }
}

// Some Minecraft versions only moved classes to new packages. Those targets ship
// versions/<mc_target>.remap (prefix=replacement per line); the build then compiles
// a copy of the sources with the prefixes rewritten, longest prefix first.
def remapFile = file("versions/${mcTarget}.remap")
if (remapFile.exists()) {
    def remaps = remapFile.readLines()
            .findAll { it.trim() && !it.trim().startsWith('#') && it.contains('=') }
            .collect { def i = it.indexOf('='); [it.substring(0, i).trim(), it.substring(i + 1).trim()] }
            .sort { -it[0].length() }
    def remapDir = layout.buildDirectory.dir('remapped-src')
    def originalSrcDirs = sourceSets.main.java.srcDirs.toList()   // captured before it is repointed
    def remapSources = tasks.register('remapSources', Sync) {
        from(originalSrcDirs) { include '**/*.java' }
        into remapDir
        inputs.file remapFile
        filter { String line ->
            if (line.contains('com.mojang.blaze3d')) {
                remaps.each { r -> line = line.replace(r[0], r[1]) }
            }
            line
        }
    }
    sourceSets.main.java.srcDirs = [remapDir]
    tasks.named('compileJava') {
        dependsOn remapSources
        doFirst {
            if (source.isEmpty()) {
                throw new GradleException("remapSources produced no Java sources for ${mcTarget}")
            }
        }
    }
    tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn remapSources }
}

repositories {
    mavenCentral()
    // MCEF Modern
    maven {
        name = 'DimasKama'
        url = uri('https://maven.dimaskama.net/releases')
    }
    // Plasmo Voice API, for the voice-chat capture addon.
    maven {
        name = 'PlasmoVerse'
        url = uri('https://repo.plasmoverse.com/releases')
    }
    // Simple Voice Chat plugin API (public addon API; compileOnly, never bundled).
    maven {
        name = 'henkelmax'
        url = uri('https://maven.maxhenkel.de/repository/public')
        content { includeGroup 'de.maxhenkel.voicechat' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = uri('https://api.modrinth.com/maven')
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Browser engine. MCEF Modern (LGPL-2.1) is bundled unmodified through
    // Fabric's Jar-in-Jar, so players no longer install it separately. It stays
    // a separate, replaceable jar inside ours - which is what the LGPL asks of a
    // combined work - and a newer standalone MCEF in mods/ still wins Fabric's
    // version resolution. Stream-able pre-installs the Chromium natives MCEF
    // needs through its own verified runtime manager (see runtime/ and
    // browser/BrowserRuntime), so MCEF's unverified downloader never runs.
    // Minecraft 26.x is distributed deobfuscated, so Loom exposes no remapping
    // ("mod*") configurations - mod dependencies are plain Gradle dependencies.
    implementation "net.dimaskama:mcef-modern:${mcef_version}"
    include "net.dimaskama:mcef-modern:${mcef_version}"

    // XZ for Java (0BSD). Decompresses the pinned Linux FFmpeg build, which is
    // only published as .tar.xz. Tiny, dependency-free, bundled via Jar-in-Jar.
    implementation "org.tukaani:xz:${xz_version}"
    include "org.tukaani:xz:${xz_version}"

    // ONNX Runtime Java API, compile-time only. The runtime jar (with its
    // native libraries) is ~55 MB, so it is never shipped inside Stream-able:
    // AudioInferenceRuntime downloads the pinned, SHA-256-verified artifact on
    // demand and loads it in an isolated class loader. Only the classes in
    // dev.streamable.audio.ai.ort touch this API, and they are defined inside
    // that loader, never by the mod's own class loader.
    compileOnly "com.microsoft.onnxruntime:onnxruntime:${onnxruntime_version}"
    testImplementation "com.microsoft.onnxruntime:onnxruntime:${onnxruntime_version}"

    // JCEF API types (org.cef.*). MCEF ships these nested (JiJ) at runtime; we
    // need them on the compile classpath to talk to CefClient/CefBrowser.
    compileOnly "me.friwi:jcef-api:${jcef_api_version}"

    // Plasmo Voice client API. compileOnly on purpose: voice-chat capture is an
    // optional integration, and the classes touching it are only ever loaded
    // when the plasmovoice mod is actually present.
    compileOnly "su.plo.voice.api:client:${plasmo_voice_version}"

    // Simple Voice Chat's public plugin API, compileOnly for the same reason:
    // the plugin class is only loaded by Simple Voice Chat itself, through its
    // "voicechat" entrypoint, so nothing references it when the mod is absent.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version

    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version,
                'minecraft_version': inputs.properties.minecraft_version,
                'loader_version': inputs.properties.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

// Unit tests cover pure logic only (transform math, config schema, secret
// redaction, FFmpeg argument building, source ordering). They never boot
// Minecraft, so they run on a plain JVM.
tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty 'streamable.hardwareTests', System.getProperty('streamable.hardwareTests', 'false')
    systemProperty 'streamable.benchmarks', System.getProperty('streamable.benchmarks', 'false')
    timeout = java.time.Duration.ofMinutes(10)
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

jar {
    // Release / CI jar name encodes the Minecraft target so Modrinth/GitHub
    // assets stay unambiguous across MC lines (e.g. stream-able-1.2.0-mc26.2-fabric.jar).
    archiveFileName = "${project.archives_base_name}-${project.mod_version}-mc${project.minecraft_version}-fabric.jar"

    // Attribution ships with the artifact, as the MIT License requires.
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from('NOTICE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Keep sources jar naming aligned (no fabric classifier; still versioned).
tasks.named('sourcesJar', Jar).configure {
    archiveFileName = "${project.archives_base_name}-${project.mod_version}-sources.jar"
}
