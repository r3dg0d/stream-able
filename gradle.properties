# Increase memory available to Gradle (Loom decompilation is memory hungry).
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# Loom is not yet fully compatible with the Gradle configuration cache.
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# Minecraft / Fabric toolchain
# ---------------------------------------------------------------------------
# Stream-able builds one jar per Minecraft version: 26.1.2, 26.2 and 26.3.
# Everything that differs per version (Minecraft, Fabric API, MCEF, loader and
# the compat source directory) lives in versions/<mc_target>.properties.
# All targets ship a Java 25 runtime, so the project is compiled at release 25.
#   ./gradlew build                       # default target below
#   ./gradlew build -Pmc_target=26.3
mc_target=26.2
loom_version=1.17.21

# No Yarn build exists for 26.x, so the project is written against official
# Mojang mappings. This also matches MCEF Modern, which is mojmap-based.
# ---------------------------------------------------------------------------
# Mod identity
# ---------------------------------------------------------------------------
mod_version=1.4.0
maven_group=dev.streamable
archives_base_name=stream-able

# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------
# MCEF Modern is pinned per Minecraft line in versions/*.properties; never mix
# the mc26.1 / mc26.2 / mc26.3 builds.
junit_version=5.11.4
jcef_api_version=jcef-d3de827+cef-146.0.10+g8219561+chromium-146.0.7680.179

# Plasmo Voice client API (compileOnly, Minecraft-independent).
plasmo_voice_version=2.1.17
# Simple Voice Chat plugin API (compileOnly, Minecraft-independent).
voicechat_api_version=2.6.24

# XZ for Java: decompresses the managed Linux FFmpeg archive (Jar-in-Jar).
xz_version=1.12
# ONNX Runtime Java API (compileOnly). Must match the runtime artifact pinned in
# src/main/resources/assets/streamable/runtime/manifest.json.
onnxruntime_version=1.30.0
