# Increase memory available to Gradle (Loom decompilation is memory hungry).
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# Loom is not yet fully compatible with the Gradle configuration cache.
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# Minecraft / Fabric toolchain
# ---------------------------------------------------------------------------
# Stream-able targets Minecraft 26.1.2 exclusively. 26.1.2 ships a Java 25
# runtime (javaVersion.majorVersion = 25 in the Mojang version manifest), so
# the whole project is compiled at release 25.
minecraft_version=26.1.2
loader_version=0.19.3
fabric_version=0.155.2+26.1.2
loom_version=1.17.17

# No Yarn build exists for 26.1.2, so the project is written against official
# Mojang mappings. This also matches MCEF Modern, which is mojmap-based.
# ---------------------------------------------------------------------------
# Mod identity
# ---------------------------------------------------------------------------
mod_version=1.1.0
maven_group=dev.streamable
archives_base_name=stream-able

# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------
# MCEF Modern build for the Minecraft 26.1 line (fabric.mod.json declares
# "minecraft": ">=26.1", so it accepts 26.1.2). Deliberately pinned - the
# newer 0.3.3+mc26.2 build targets Minecraft 26.2 and must not be used here.
mcef_version=0.3.3+mc26.1.jcef146.0.10
junit_version=5.11.4
jcef_api_version=jcef-d3de827+cef-146.0.10+g8219561+chromium-146.0.7680.179

# Plasmo Voice client API. Pinned to the version shipped by the plasmovoice mod
# for the Minecraft 26.1 line (plasmovoice-fabric-26.1-2.1.13).
plasmo_voice_version=2.1.13

# XZ for Java: decompresses the managed Linux FFmpeg archive (Jar-in-Jar).
xz_version=1.12
# ONNX Runtime Java API (compileOnly). Must match the runtime artifact pinned in
# src/main/resources/assets/streamable/runtime/manifest.json.
onnxruntime_version=1.30.0
