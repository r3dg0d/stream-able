# Stream-able CI — unit/integration tests + jar on Java 25 (Linux + Windows).
# Model / hardware / benchmark suites are opt-in via env/system props and
# skip cleanly when STREAMABLE_MODEL_DIR / streamable.benchmarks are unset.
# Minecraft 26.x is mojmap/deobfuscated, so Loom has no remapJar task.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Keep ./gradlew portable across ubuntu and windows-latest runners.
    shell: bash

jobs:
  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check mod_version and every supported Minecraft version match docs
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^mod_version=//p' gradle.properties | head -1 | tr -d '[:space:]')
          default=$(sed -n 's/^mc_target=//p' gradle.properties | head -1 | tr -d '[:space:]')
          test -n "$ver"
          test -f "versions/${default}.properties"
          grep -E "^## ${ver}( |$)" CHANGELOG.md
          for f in versions/*.properties; do
            mc=$(sed -n 's/^minecraft_version=//p' "$f" | head -1 | tr -d '[:space:]')
            test "$mc" = "$(basename "$f" .properties)"
            test -d "src/compat/$(sed -n 's/^compat_dir=//p' "$f" | head -1 | tr -d '[:space:]')"
            grep -F "mc${mc}-fabric" README.md
            grep -F "**${mc}**" README.md
            echo "Minecraft ${mc}: version file, compat dir and README OK"
          done
          grep -F "Minecraft ${default}" CHANGELOG.md
          echo "mod_version=${ver} default target=${default} OK"

  test:
    name: Test and build (${{ matrix.os }}, MC ${{ matrix.mc }})
    runs-on: ${{ matrix.os }}
    needs: version-sync
    strategy:
      fail-fast: false
      matrix:
        # One jar per Minecraft version. Windows only proves the default
        # target's sources compile there; the version split is platform-neutral.
        include:
          - { os: ubuntu-latest, mc: '26.1.2' }
          - { os: ubuntu-latest, mc: '26.2' }
          - { os: ubuntu-latest, mc: '26.3' }
          - { os: windows-latest, mc: '26.2' }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Temurin 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew test -Pmc_target=${{ matrix.mc }} --no-daemon --stacktrace

      - name: Build jar
        run: ./gradlew build -x test -Pmc_target=${{ matrix.mc }} --no-daemon --stacktrace

      - name: Assert jar name encodes versions
        # Catches archiveFileName drift vs gradle.properties / version-sync.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^mod_version=//p' gradle.properties | head -1 | tr -d '[:space:]')
          mc='${{ matrix.mc }}'
          jar="build/libs/stream-able-${ver}-mc${mc}-fabric.jar"
          test -f "$jar"
          echo "OK $jar"

      - name: Upload jar
        # One jar per Minecraft version from Linux; Windows proves the same sources compile.
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: stream-able-jar-mc${{ matrix.mc }}
          # Named stream-able-<ver>-mc<mc>-fabric.jar by build.gradle
          path: |
            build/libs/stream-able-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14

  boot:
    # Boots a real client on each Minecraft version and drives the Studio through the game's
    # own input path. Mixin targets, shaders and key numbering only fail at runtime, so
    # compiling is not enough to call a version supported.
    name: Boot test (MC ${{ matrix.mc }})
    runs-on: ubuntu-latest
    needs: version-sync
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Temurin 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Virtual display and software graphics
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri mesa-vulkan-drivers \
            libvulkan1 libxrandr2 libxxf86vm1 libxi6 libxcursor1 libxrender1 libxext6 libxtst6 \
            libopenal1 libpulse0

      - name: Client game test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          SDL_VIDEODRIVER: x11
        run: |
          chmod +x gradlew
          # One retry: SDL/X11 start-up on a virtual display occasionally stalls.
          for attempt in 1 2; do
            if timeout 900 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX" \
                 ./gradlew runClientGameTest -Pmc_target=${{ matrix.mc }} --no-daemon --stacktrace; then
              exit 0
            fi
            echo "attempt $attempt failed"; pkill -9 -f fabric.dli.config || true
          done
          exit 1

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-test-mc${{ matrix.mc }}
          path: build/run/clientGameTest/screenshots/
          if-no-files-found: ignore
          retention-days: 7
