# Stream-able CI — unit/integration tests + jar on Java 25.
# Model / hardware / benchmark suites are opt-in via env/system props and
# skip cleanly when STREAMABLE_MODEL_DIR / streamable.benchmarks are unset.
# Minecraft 26.x is mojmap/deobfuscated, so Loom has no remapJar task.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check mod_version matches CHANGELOG
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^mod_version=//p' gradle.properties | head -1 | tr -d '[:space:]')
          test -n "$ver"
          grep -E "^## ${ver}( |$)" CHANGELOG.md
          echo "mod_version=${ver} is present in CHANGELOG.md"

  test:
    name: Test and build (Java 25)
    runs-on: ubuntu-latest
    needs: version-sync
    steps:
      - uses: actions/checkout@v7

      - name: Set up Temurin 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build jar
        run: ./gradlew build -x test --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: stream-able-jar
          # Named stream-able-<ver>-mc<mc>-fabric.jar by build.gradle
          path: |
            build/libs/stream-able-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
