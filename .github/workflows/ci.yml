# Stream-able CI — unit/integration tests + jar on Java 25 (Linux + Windows).
# Model / hardware / benchmark suites are opt-in via env/system props and
# skip cleanly when STREAMABLE_MODEL_DIR / streamable.benchmarks are unset.
# Minecraft 26.x is mojmap/deobfuscated, so Loom has no remapJar task.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Keep ./gradlew portable across ubuntu and windows-latest runners.
    shell: bash

jobs:
  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check mod_version / minecraft_version match docs
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^mod_version=//p' gradle.properties | head -1 | tr -d '[:space:]')
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties | head -1 | tr -d '[:space:]')
          test -n "$ver"
          test -n "$mc"
          grep -E "^## ${ver}( |$)" CHANGELOG.md
          grep -F "Minecraft ${mc}" CHANGELOG.md
          grep -F "mc${mc}-fabric" README.md
          grep -E "^\| Minecraft \| \*\*${mc}\*\*" README.md
          echo "mod_version=${ver} minecraft_version=${mc} OK in CHANGELOG + README"

  test:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: version-sync
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Temurin 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build jar
        run: ./gradlew build -x test --no-daemon --stacktrace

      - name: Assert jar name encodes versions
        # Catches archiveFileName drift vs gradle.properties / version-sync.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^mod_version=//p' gradle.properties | head -1 | tr -d '[:space:]')
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties | head -1 | tr -d '[:space:]')
          jar="build/libs/stream-able-${ver}-mc${mc}-fabric.jar"
          test -f "$jar"
          echo "OK $jar"

      - name: Upload jar
        # One jar artifact from Linux is enough; Windows proves the same sources compile.
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: stream-able-jar
          # Named stream-able-<ver>-mc<mc>-fabric.jar by build.gradle
          path: |
            build/libs/stream-able-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
